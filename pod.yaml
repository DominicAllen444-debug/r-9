apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo-pod
  labels:
    app: pvc-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Pod started; mounted volume is /data'; sleep 36000"]
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: jenkins-demo-pvc
